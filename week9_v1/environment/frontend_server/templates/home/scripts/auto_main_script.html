{% load staticfiles %}

<div id="persona_name_list" style="display:none">{{persona_name_str}}</div>
<div id="persona_init_pos" style="display:none">
	{% for i in persona_init_pos %}
		<span>{{i.0}},{{i.1}},{{i.2}}</span>
	{% endfor %}
</div>

<script type="text/javascript">
	let render_step = {{render_step|default:step}};
	let playback_step = {{playback_step|default:step}};
	let step = playback_step;
	let sim_code = "{{sim_code}}";
	let mode = "{{mode}}";
	let maze_size = {{maze_size}};
	let runtime_sync = {
		status_step: {{ runtime_sources.status_step|default:"null" }},
		curr_step_pointer: {{ runtime_sources.curr_step_pointer|default:"null" }},
		latest_movement_step: {{ runtime_sources.latest_movement_step|default:"null" }},
		latest_environment_step: {{ runtime_sources.latest_environment_step|default:"null" }},
		in_sync: {{ runtime_sources.in_sync|yesno:"true,false" }},
	};
	let backend_health = {
		backend_alive: false,
		pending_command_count: 0,
		pending_command_ids: [],
		last_command_timestamp: null,
		last_progress_timestamp: null,
		stalled: false,
	};
	let spans = document.getElementById("persona_init_pos").getElementsByTagName("span");
	let persona_names = {};
	for (let i = 0; i < spans.length; i++) {
		let parts = spans[i].innerText.split(",");
		persona_names[parts[0]] = [parseInt(parts[1]), parseInt(parts[2])];
	}

	const ROLE_STYLE = {
		doctor: { badge: "#dce8ff", tag: "DR" },
		triage_nurse: { badge: "#ffe9c9", tag: "TN" },
		calling_nurse: { badge: "#e5e8ff", tag: "CN" },
		bed_nurse: { badge: "#d9f5e6", tag: "BN" },
		patient: { badge: "#eceff1", tag: "PT" },
		other: { badge: "#f0f0f0", tag: "OT" },
	};
	const ROLE_SPRITE_KEY = {
		doctor: "Doctor_1",
		triage_nurse: "Triage_Nurse_1",
		calling_nurse: "Triage_Nurse_1",
		bed_nurse: "Bedside_Nurse_1",
		patient: "Patient_1",
		other: "Patient_2",
	};
	const ROLE_FIGURE_KEY = {
		doctor: "role_doctor",
		triage_nurse: "role_triage_nurse",
		calling_nurse: "role_calling_nurse",
		bed_nurse: "role_bed_nurse",
		patient: "role_patient",
		other: "role_other_patient",
	};
	const ROLE_AVATAR_PATH = {
		doctor: "assets/characters/profile/Doctor_1.png",
		triage_nurse: "assets/characters/profile/Triage_Nurse_1.png",
		calling_nurse: "assets/characters/profile/Triage_Nurse_1.png",
		bed_nurse: "assets/characters/profile/Bedside_Nurse_1.png",
		patient: "assets/characters/profile/Patient_1.png",
		other: "assets/characters/profile/Patient_2.png",
	};

	function roleKeyForName(personaName) {
		const n = (personaName || "").toLowerCase();
		if (n.includes("calling")) return "calling_nurse";
		if (n.includes("triage")) return "triage_nurse";
		if (n.includes("doctor")) return "doctor";
		if (n.includes("bedside") || n.includes("bed nurse")) return "bed_nurse";
		if (n.includes("patient")) return "patient";
		return "other";
	}

	function roleForName(personaName) {
		return ROLE_STYLE[roleKeyForName(personaName)] || ROLE_STYLE.other;
	}

	function normalizeRoleKey(roleKey) {
		const normalized = String(roleKey || "").trim().toLowerCase();
		return ROLE_STYLE[normalized] ? normalized : "";
	}

	function resolveRolePresentation(personaName, movementInfo) {
		const fallbackRoleKey = roleKeyForName(personaName);
		const payloadRoleKey = movementInfo ? normalizeRoleKey(movementInfo["role_key"]) : "";
		const roleKey = payloadRoleKey || fallbackRoleKey;
		const roleStyle = ROLE_STYLE[roleKey] || ROLE_STYLE.other;
		const payloadBadge = movementInfo && typeof movementInfo["badge"] === "string"
			? movementInfo["badge"].trim().toUpperCase()
			: "";
		return {
			roleKey: roleKey,
			badge: payloadBadge || roleStyle.tag,
		};
	}

	function avatarKeyForRole(roleKey) {
		return ROLE_FIGURE_KEY[roleKey] || ROLE_FIGURE_KEY.other;
	}

	function avatarPathForRole(roleKey) {
		return ROLE_AVATAR_PATH[roleKey] || ROLE_AVATAR_PATH.other;
	}

	function spriteKeyForPersona(personaName) {
		const roleKey = roleKeyForName(personaName);
		if (roleKey === "patient") {
			const match = String(personaName || "").match(/(\d+)/);
			if (match) {
				return parseInt(match[1], 10) % 2 === 0 ? "Patient_2" : "Patient_1";
			}
		}
		return ROLE_SPRITE_KEY[roleKey] || ROLE_SPRITE_KEY.other;
	}

	function ensureSpriteAnimations(anims, spriteKey) {
		if (anims.exists(`${spriteKey}-down-walk`)) return;
		anims.create({ key: `${spriteKey}-down-walk`, frames: anims.generateFrameNumbers(spriteKey, { start: 0, end: 2 }), frameRate: 4, repeat: -1 });
		anims.create({ key: `${spriteKey}-left-walk`, frames: anims.generateFrameNumbers(spriteKey, { start: 3, end: 5 }), frameRate: 4, repeat: -1 });
		anims.create({ key: `${spriteKey}-right-walk`, frames: anims.generateFrameNumbers(spriteKey, { start: 6, end: 8 }), frameRate: 4, repeat: -1 });
		anims.create({ key: `${spriteKey}-up-walk`, frames: anims.generateFrameNumbers(spriteKey, { start: 9, end: 11 }), frameRate: 4, repeat: -1 });
	}

	function buildInitials(personaName) {
		let rgx = new RegExp(/(\p{L})[\p{L}]*|(\p{N}+)/, "gu");
		let matches = [...personaName.matchAll(rgx)] || [];
		let parts = matches.map(m => m[1] || m[2]);
		let first = parts.shift() || "";
		let last = parts.length > 0 ? parts.pop() : "";
		return (first + last).toUpperCase();
	}

	const config = {
		fps: { target: mode === "replay" ? 30 : 12, forceSetTimeOut: true },
		type: Phaser.AUTO,
		width: (64 * maze_size[0]),
		height: (64 * maze_size[1]),
		parent: "game-container",
		pixelArt: true,
		physics: {
			default: "arcade",
			arcade: { gravity: { y: 0 } }
		},
		scene: {
			preload: preload,
			create: create,
			update: update
		},
		scale: { zoom: 13 / maze_size[0] }
	};

	const game = new Phaser.Game(config);
	let personas = {};
	let pronunciatios = {};
	let nameBadges = {};
	let figureBadges = {};
	let movementPathQueue = {};
	let currentTargetTile = {};
	let pendingSnapTile = {};
	let movement_target = {};
	let execute_movement = null;
	let execute_ready = false;
	let phase = "update";
	let timer_max = mode === "replay" ? 0 : 1;
	let timer = 0;
	let tile_width = 32;
	let movement_speed_pixels = mode === "replay" ? 8 : 6;
	let curr_maze = "ed_map";
	let player = null;
	let pre_anims_direction_dict = {};
	let runtime_status_request = null;
	let movement_request = null;
	let hasConsumedMovement = false;
	let environment_request = null;
	let bootstrap_environment_pending = true;
	let process_retry_count = 0;
	let process_retry_cooldown_frames = 0;
	let last_process_status = "idle";
	let last_process_error = "";
	let movement_wait_reason = "bootstrap_pending";
	window.__EDSIM_DEBUG__ = window.__EDSIM_DEBUG__ || {};
	window.__EDSIM_DEBUG__.personas = {};
	window.__EDSIM_DEBUG__.movement = {};
	window.__EDSIM_DEBUG__.spawnOrder = [];
	window.__EDSIM_DEBUG__.mode = mode;
	window.__EDSIM_DEBUG__.initialMovementConsumed = false;
	window.__EDSIM_DEBUG__.renderStep = render_step;
	window.__EDSIM_DEBUG__.playbackStep = playback_step;
	window.__EDSIM_DEBUG__.runtimeSync = runtime_sync;
	window.__EDSIM_DEBUG__.backendHealth = backend_health;
	window.__EDSIM_DEBUG__.lastProcessStatus = last_process_status;
	window.__EDSIM_DEBUG__.lastProcessError = last_process_error;
	window.__EDSIM_DEBUG__.processRetryCount = process_retry_count;
	window.__EDSIM_DEBUG__.movementWaitReason = movement_wait_reason;

	function tilesEqual(a, b) {
		return Array.isArray(a) && Array.isArray(b) && a[0] === b[0] && a[1] === b[1];
	}

	function manhattanDistance(a, b) {
		return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
	}

	function stepTowards(currentValue, targetValue, maxStep) {
		const delta = targetValue - currentValue;
		if (Math.abs(delta) <= maxStep) return targetValue;
		return currentValue + Math.sign(delta) * maxStep;
	}

	function snapBodyToGrid(value) {
		return Math.max(0, Math.round(value / tile_width));
	}

	function getCurrentTileForSprite(sprite) {
		return [snapBodyToGrid(sprite.body.x), snapBodyToGrid(sprite.body.y)];
	}

	function toPixelTarget(tile) {
		return [tile[0] * tile_width, tile[1] * tile_width];
	}

	function symmetricDifference(arr1, arr2) {
		const set1 = new Set(arr1);
		const set2 = new Set(arr2);
		const result = new Set();
		for (const item of set1) {
			if (!set2.has(item)) result.add(item);
		}
		for (const item of set2) {
			if (!set1.has(item)) result.add(item);
		}
		return Array.from(result);
	}

	function formatRuntimeValue(value) {
		return value === null || value === undefined ? "--" : value;
	}

	function refreshRuntimeDebugState() {
		window.__EDSIM_DEBUG__.renderStep = render_step;
		window.__EDSIM_DEBUG__.playbackStep = playback_step;
		window.__EDSIM_DEBUG__.runtimeSync = runtime_sync;
		window.__EDSIM_DEBUG__.backendHealth = backend_health;
		window.__EDSIM_DEBUG__.phase = phase;
		window.__EDSIM_DEBUG__.lastProcessStatus = last_process_status;
		window.__EDSIM_DEBUG__.lastProcessError = last_process_error;
		window.__EDSIM_DEBUG__.processRetryCount = process_retry_count;
		window.__EDSIM_DEBUG__.movementWaitReason = movement_wait_reason;
	}

	function isFiniteStep(value) {
		return value !== null && value !== undefined && Number.isFinite(Number(value));
	}

	function alignPlaybackWithRuntime() {
		const latestMovementStep = isFiniteStep(runtime_sync.latest_movement_step)
			? Number(runtime_sync.latest_movement_step)
			: null;
		const latestEnvironmentStep = isFiniteStep(runtime_sync.latest_environment_step)
			? Number(runtime_sync.latest_environment_step)
			: null;
		if (latestMovementStep === null || latestEnvironmentStep === null) return;
		if (latestEnvironmentStep <= latestMovementStep) return;
		const stableRenderStep = latestMovementStep;
		const stablePlaybackStep = stableRenderStep + 1;
		if (render_step !== stableRenderStep || playback_step !== stablePlaybackStep) {
			render_step = stableRenderStep;
			playback_step = stablePlaybackStep;
			step = playback_step;
			movement_wait_reason = "environment_ahead_of_movement";
			refreshRuntimeDebugState();
		}
	}

	function updateRuntimeStatusBanner(extraMessage) {
		const summary = document.getElementById("runtime-sync-summary");
		if (summary) {
			summary.textContent = `Render step ${formatRuntimeValue(render_step)}, playback step ${formatRuntimeValue(playback_step)}, status step ${formatRuntimeValue(runtime_sync.status_step)}, pointer ${formatRuntimeValue(runtime_sync.curr_step_pointer)}, latest movement ${formatRuntimeValue(runtime_sync.latest_movement_step)}, latest environment ${formatRuntimeValue(runtime_sync.latest_environment_step)}.`;
		}
		const waiting = document.getElementById("runtime-sync-waiting");
		if (!waiting) return;
		if (backend_health.stalled) {
			movement_wait_reason = "backend_not_consuming_commands";
			waiting.textContent = `Backend is not consuming commands: ${backend_health.pending_command_count} pending command(s), no healthy reverie runtime detected.`;
			refreshRuntimeDebugState();
			return;
		}
		const movementStep = runtime_sync.latest_movement_step;
		const envStep = runtime_sync.latest_environment_step;
		const writebackLagged = Number.isFinite(movementStep) && Number.isFinite(envStep) && movementStep > (envStep + 1);
		if (writebackLagged) {
			movement_wait_reason = "environment_writeback_lag";
			waiting.textContent = `Frontend environment write-back lag detected: movement is at ${movementStep}, environment is at ${envStep}.`;
			refreshRuntimeDebugState();
			return;
		}
		const staleEnvironmentAhead = Number.isFinite(movementStep) && Number.isFinite(envStep) && envStep > movementStep;
		if (staleEnvironmentAhead && playback_step > (movementStep + 1)) {
			movement_wait_reason = "environment_ahead_of_movement";
			waiting.textContent = `Environment snapshots were ahead of movement. Auto mode reset playback to wait for movement step ${movementStep + 1}.`;
			refreshRuntimeDebugState();
			return;
		}
		const waitingForMovement = runtime_sync.latest_movement_step == null || runtime_sync.latest_movement_step < playback_step;
		if (extraMessage) {
			waiting.textContent = extraMessage;
			refreshRuntimeDebugState();
			return;
		}
		movement_wait_reason = waitingForMovement ? "waiting_for_backend_progress" : "movement_available";
		waiting.textContent = waitingForMovement
			? `Waiting for backend progress: next playback step ${playback_step}, latest movement ${formatRuntimeValue(runtime_sync.latest_movement_step)}.`
			: `Movement available for playback step ${playback_step}.`;
		refreshRuntimeDebugState();
	}

	function applyRuntimeSync(payload) {
		const sync = (payload && payload.runtime_sync) ? payload.runtime_sync : {};
		const health = (payload && payload.backend_health) ? payload.backend_health : {};
		runtime_sync = {
			status_step: sync.status_step ?? null,
			curr_step_pointer: sync.curr_step_pointer ?? null,
			latest_movement_step: sync.latest_movement_step ?? null,
			latest_environment_step: sync.latest_environment_step ?? null,
			in_sync: Boolean(sync.in_sync),
		};
		backend_health = {
			backend_alive: Boolean(health.backend_alive),
			pending_command_count: parseInt(health.pending_command_count ?? 0),
			pending_command_ids: Array.isArray(health.pending_command_ids) ? health.pending_command_ids : [],
			last_command_timestamp: health.last_command_timestamp ?? null,
			last_progress_timestamp: health.last_progress_timestamp ?? null,
			stalled: Boolean(health.stalled),
		};
		alignPlaybackWithRuntime();
		refreshRuntimeDebugState();
		updateRuntimeStatusBanner();
	}

	function pollRuntimeStatus(onComplete) {
		if (runtime_status_request) {
			return;
		}
		runtime_status_request = new XMLHttpRequest();
		runtime_status_request.overrideMimeType("application/json");
		runtime_status_request.open("GET", "{% url 'live_dashboard_api' %}", true);
		runtime_status_request.addEventListener("load", function() {
			try {
				if (this.readyState === 4 && runtime_status_request.status === 200) {
					const payload = JSON.parse(runtime_status_request.responseText);
					applyRuntimeSync(payload);
				}
			} catch (err) {
				updateRuntimeStatusBanner(`Runtime status parse failed: ${err}`);
			} finally {
				runtime_status_request = null;
				if (typeof onComplete === "function") onComplete();
			}
		});
		runtime_status_request.addEventListener("error", function() {
			runtime_status_request = null;
			updateRuntimeStatusBanner("Runtime status request failed; retrying.");
			if (typeof onComplete === "function") onComplete();
		});
		runtime_status_request.send();
	}

	function postEnvironmentSnapshot(targetStep, nextPhase) {
		if (environment_request) {
			return;
		}
		if (process_retry_cooldown_frames > 0) {
			process_retry_cooldown_frames = process_retry_cooldown_frames - 1;
			return;
		}
		let data = {"step": targetStep, "sim_code": sim_code, "environment": {}};
		for (let i = 0; i < Object.keys(personas).length; i++) {
			let personaName = Object.keys(personas)[i];
			const resolvedRoleKey = (personas[personaName] && personas[personaName].data && personas[personaName].data.get("roleKey"))
				|| roleKeyForName(personaName);
			data["environment"][personaName] = {
				"maze": curr_maze,
				"x": snapBodyToGrid(personas[personaName].body.x),
				"y": snapBodyToGrid(personas[personaName].body.y),
				"name": personaName,
				"role": resolvedRoleKey,
				"persona_role": resolvedRoleKey,
				"act": movementPathQueue[personaName] && movementPathQueue[personaName].length ? "moving" : "idle",
			};
		}
		environment_request = new XMLHttpRequest();
		environment_request.overrideMimeType("application/json");
		environment_request.open("POST", "{% url 'process_environment' %}", true);
		environment_request.setRequestHeader("Content-Type", "application/json");
		environment_request.addEventListener("load", function() {
			try {
				let responseData = null;
				let responseText = environment_request.responseText || "";
				if (responseText) {
					responseData = JSON.parse(responseText);
				}
				if (environment_request.status === 200 && responseData && responseData.ok) {
					last_process_status = "ok";
					last_process_error = "";
					process_retry_count = 0;
					process_retry_cooldown_frames = 0;
					movement_wait_reason = "environment_writeback_ok";
					phase = nextPhase;
				} else {
					last_process_status = `http_${environment_request.status}`;
					last_process_error = responseData && responseData.error ? String(responseData.error) : "process_environment request failed";
					process_retry_count = process_retry_count + 1;
					process_retry_cooldown_frames = 12;
					movement_wait_reason = "process_environment_error";
					phase = "process";
					updateRuntimeStatusBanner(`Failed to publish environment/${targetStep}.json: ${last_process_error}`);
				}
			} catch (err) {
				last_process_status = `http_${environment_request.status}`;
				last_process_error = `response parse failed: ${err}`;
				process_retry_count = process_retry_count + 1;
				process_retry_cooldown_frames = 12;
				movement_wait_reason = "process_environment_error";
				phase = "process";
				updateRuntimeStatusBanner(`Failed to publish environment/${targetStep}.json: ${last_process_error}`);
			} finally {
				refreshRuntimeDebugState();
				environment_request = null;
			}
		});
		environment_request.addEventListener("error", function() {
			last_process_status = "network_error";
			last_process_error = "process_environment network error";
			process_retry_count = process_retry_count + 1;
			process_retry_cooldown_frames = 12;
			movement_wait_reason = "process_environment_error";
			phase = "process";
			environment_request = null;
			refreshRuntimeDebugState();
			updateRuntimeStatusBanner(`Failed to publish environment/${targetStep}.json; retrying.`);
		});
		environment_request.send(JSON.stringify(data));
	}

	function sanitizeMovementPath(currTile, targetTile, rawPath) {
		let normalized = [];
		if (Array.isArray(rawPath)) {
			for (let i = 0; i < rawPath.length; i++) {
				const tile = rawPath[i];
				if (!Array.isArray(tile) || tile.length !== 2) continue;
				const coord = [parseInt(tile[0]), parseInt(tile[1])];
				if (!Number.isFinite(coord[0]) || !Number.isFinite(coord[1])) continue;
				if (!normalized.length || !tilesEqual(normalized[normalized.length - 1], coord)) {
					normalized.push(coord);
				}
			}
		}
		if (normalized.length && tilesEqual(normalized[0], currTile)) normalized = normalized.slice(1);
		let prev = currTile;
		for (let i = 0; i < normalized.length; i++) {
			if (manhattanDistance(prev, normalized[i]) !== 1) {
				normalized = [];
				break;
			}
			prev = normalized[i];
		}
		if (normalized.length && !tilesEqual(normalized[normalized.length - 1], targetTile)) {
			if (manhattanDistance(normalized[normalized.length - 1], targetTile) === 1) normalized.push(targetTile);
			else normalized = [];
		}
		if (normalized.length) return { tiles: normalized, source: "movement_path", warning: "" };
		if (tilesEqual(currTile, targetTile)) return { tiles: [], source: "stay_put", warning: "" };
		if (manhattanDistance(currTile, targetTile) === 1) return { tiles: [targetTile], source: "adjacent_fallback", warning: "" };
		return { tiles: [], source: "snap_only", warning: `missing_or_invalid_path:${currTile[0]},${currTile[1]}->${targetTile[0]},${targetTile[1]}` };
	}

	function updatePersonaDecorations(personaName) {
		const sprite = personas[personaName];
		const pron = pronunciatios[personaName];
		if (!sprite || !pron) return;
		pron.x = sprite.body.x - 6;
		pron.y = sprite.body.y - 42 - 32;
		if (nameBadges[personaName]) {
			nameBadges[personaName].x = sprite.body.x - 8;
			nameBadges[personaName].y = sprite.body.y - 64 - 32;
		}
		if (figureBadges[personaName]) {
			figureBadges[personaName].x = sprite.body.x + 14;
			figureBadges[personaName].y = sprite.body.y - 52;
		}
	}

	function registerPersonaDebug(personaName, roleKey, avatarKey, spriteKey, badgeTag) {
		window.__EDSIM_DEBUG__.personas[personaName] = {
			roleKey: roleKey,
			spriteKey: spriteKey,
			figureKey: avatarKey,
			avatarKey: avatarKey,
			badgeTag: badgeTag,
		};
	}

	function attachPersonaDecorations(scene, personaName, sprite) {
		const roleKey = roleKeyForName(personaName);
		const avatarKey = avatarKeyForRole(roleKey);
		const role = roleForName(personaName);
		const spriteKey = spriteKeyForPersona(personaName);
		if (!sprite.data) sprite.setDataEnabled();
		sprite.data.set("roleKey", roleKey);
		sprite.data.set("spriteKey", spriteKey);
		sprite.data.set("figureKey", avatarKey);
		sprite.data.set("avatarKey", avatarKey);
		sprite.data.set("badgeTag", role.tag);
		nameBadges[personaName] = scene.add.text(
			sprite.body.x - 8,
			sprite.body.y - 64 - 32,
			role.tag,
			{
				font: "12px monospace",
				fill: "#111111",
				backgroundColor: "#ffffff",
				padding: {x: 4, y: 1},
			}
		).setDepth(6);
		figureBadges[personaName] = scene.add.image(
			sprite.body.x + 14,
			sprite.body.y - 52,
			avatarKey
		).setDepth(7).setScale(0.15);
		registerPersonaDebug(personaName, roleKey, avatarKey, spriteKey, role.tag);
	}

	function applyPersonaRolePresentation(personaName, movementInfo) {
		const roleInfo = resolveRolePresentation(personaName, movementInfo);
		const avatarKey = avatarKeyForRole(roleInfo.roleKey);
		const sprite = personas[personaName];
		if (sprite && sprite.data) {
			sprite.data.set("roleKey", roleInfo.roleKey);
			sprite.data.set("badgeTag", roleInfo.badge);
			sprite.data.set("figureKey", avatarKey);
			sprite.data.set("avatarKey", avatarKey);
		}
		if (nameBadges[personaName]) {
			nameBadges[personaName].setText(roleInfo.badge);
		}
		if (figureBadges[personaName]) {
			figureBadges[personaName].setTexture(avatarKey);
		}
		const panel = document.getElementById("on_screen_det_content-" + personaName.replace(/ /g, "_"));
		if (panel) {
			panel.setAttribute("data-role-key", roleInfo.roleKey);
			panel.setAttribute("data-avatar-key", avatarKey);
			panel.setAttribute("data-figure-key", avatarKey);
		}
		registerPersonaDebug(
			personaName,
			roleInfo.roleKey,
			avatarKey,
			(sprite && sprite.data && sprite.data.get("spriteKey")) || spriteKeyForPersona(personaName),
			roleInfo.badge
		);
		return roleInfo;
	}

	function destroyPersonaDecorations(personaName) {
		if (nameBadges[personaName]) {
			nameBadges[personaName].destroy();
			delete nameBadges[personaName];
		}
		if (figureBadges[personaName]) {
			figureBadges[personaName].destroy();
			delete figureBadges[personaName];
		}
		delete window.__EDSIM_DEBUG__.personas[personaName];
		delete window.__EDSIM_DEBUG__.movement[personaName];
	}

	function createPersonaVisual(scene, personaName, tile, movementInfo) {
		const roleInfo = resolveRolePresentation(personaName, movementInfo);
		const roleStyle = ROLE_STYLE[roleInfo.roleKey] || ROLE_STYLE.other;
		const spriteKey = spriteKeyForPersona(personaName);
		const start_pos = [tile[0] * tile_width + tile_width / 2, tile[1] * tile_width + tile_width];
		let new_sprite = scene.physics.add
			.sprite(start_pos[0], start_pos[1], spriteKey, 0)
			.setSize(30, 40)
			.setOffset(0, 10)
			.setOrigin(0.5, 1);
		new_sprite.displayWidth = 30;
		new_sprite.scaleY = new_sprite.scaleX;
		personas[personaName] = new_sprite;
		pronunciatios[personaName] = scene.add.text(
			new_sprite.body.x - 6,
			new_sprite.body.y - 42 - 32,
			roleInfo.badge + ": ...",
			{
				font: "28px monospace",
				fill: "#000000",
				padding: { x: 8, y: 8},
				backgroundColor: roleStyle.badge,
				border: "solid",
				borderRadius: "10px"
			}
		).setDepth(3);
		attachPersonaDecorations(scene, personaName, new_sprite);
		window.__EDSIM_DEBUG__.spawnOrder.push(personaName);
		addNewPersonaSection(personaName, personaName.replaceAll(" ", "_"), null, null, null, movementInfo);
		applyPersonaRolePresentation(personaName, movementInfo);
	}

	function removePersonaVisual(personaName) {
		if (personas[personaName]) personas[personaName].destroy();
		if (pronunciatios[personaName]) pronunciatios[personaName].destroy();
		destroyPersonaDecorations(personaName);
		delete personas[personaName];
		delete pronunciatios[personaName];
	}

	function parsePersonaStatus(movementInfo) {
		const rawDescription = ((movementInfo["description"] || "") + "").trim();
		if (!rawDescription) {
			const movement = movementInfo["movement"] || [0, 0];
			return {
				action: "<em>No active task yet</em>",
				location: `Tile (${movement[0]}, ${movement[1]})`,
			};
		}
		const segments = rawDescription.split("@");
		return {
			action: (segments[0] || "").trim() || "<em>No active task yet</em>",
			location: (segments.slice(1).join("@") || "").trim() || "<em>Not available yet</em>",
		};
	}

	function formatTileText(tile) {
		if (!Array.isArray(tile) || tile.length < 2) return "--";
		return `(${tile[0]}, ${tile[1]})`;
	}

	function updatePersonaPanels() {
		for (let i = 0; i < Object.keys(personas).length; i++) {
			let personaName = Object.keys(personas)[i];
			if (!execute_movement["persona"][personaName]) continue;
			let movementInfo = execute_movement["persona"][personaName];
			let personaStatus = parsePersonaStatus(movementInfo);
			let personaNameOs = personaName.replace(/ /g, "_");
			const roleInfo = applyPersonaRolePresentation(personaName, movementInfo);
			const movementTarget = Array.isArray(movementInfo["movement"])
				? [parseInt(movementInfo["movement"][0]), parseInt(movementInfo["movement"][1])]
				: null;
			const movementPath = Array.isArray(movementInfo["movement_path"])
				? movementInfo["movement_path"]
				: (Array.isArray(movementInfo["path_tiles"]) ? movementInfo["path_tiles"] : []);
			const movementPathLength = movementPath.length;
			const hasChat = Array.isArray(movementInfo["chat"]) && movementInfo["chat"].length > 0;
			const sourceType = movementInfo["dialogue_provenance"] && movementInfo["dialogue_provenance"]["source_type"]
				? String(movementInfo["dialogue_provenance"]["source_type"])
				: "none";
			const sprite = personas[personaName];
			const envTile = sprite ? getCurrentTileForSprite(sprite) : null;

			document.getElementById("panel_step__" + personaNameOs).textContent = String(playback_step);
			document.getElementById("panel_role__" + personaNameOs).textContent = `${roleInfo.badge} / ${roleInfo.roleKey}`;
			document.getElementById("current_action__" + personaNameOs).innerHTML = personaStatus.action;
			document.getElementById("target_address__" + personaNameOs).innerHTML = personaStatus.location;
			document.getElementById("panel_target__" + personaNameOs).textContent = formatTileText(movementTarget);
			document.getElementById("panel_path_len__" + personaNameOs).textContent = String(movementPathLength);
			document.getElementById("panel_env__" + personaNameOs).textContent = formatTileText(envTile);
			document.getElementById("panel_chat_exists__" + personaNameOs).textContent = hasChat ? "yes" : "no";
			document.getElementById("panel_chat_source__" + personaNameOs).textContent = sourceType;
		}
	}

	function updatePronunciatios() {
		for (let i = 0; i < Object.keys(personas).length; i++) {
			let personaName = Object.keys(personas)[i];
			if (!execute_movement["persona"][personaName]) continue;
			const roleInfo = resolveRolePresentation(personaName, execute_movement["persona"][personaName]);
			let content = execute_movement["persona"][personaName]["pronunciatio"] || "\ud83e\udd22";
			pronunciatios[personaName].setText(roleInfo.badge + " " + buildInitials(personaName) + ": " + content);
		}
	}

	function prepareMovementPlayback() {
		movement_target = {};
		movementPathQueue = {};
		currentTargetTile = {};
		pendingSnapTile = {};
		for (let i = 0; i < Object.keys(personas).length; i++) {
			const personaName = Object.keys(personas)[i];
			const movementInfo = execute_movement["persona"][personaName];
			if (!movementInfo) continue;
			const currTile = getCurrentTileForSprite(personas[personaName]);
			const targetTile = Array.isArray(movementInfo["movement"])
				? [parseInt(movementInfo["movement"][0]), parseInt(movementInfo["movement"][1])]
				: currTile;
			const pathResult = sanitizeMovementPath(currTile, targetTile, movementInfo["movement_path"] || movementInfo["path_tiles"]);
			movementPathQueue[personaName] = pathResult.tiles.slice();
			currentTargetTile[personaName] = movementPathQueue[personaName].length ? movementPathQueue[personaName][0] : null;
			pendingSnapTile[personaName] = targetTile;
			movement_target[personaName] = currentTargetTile[personaName]
				? toPixelTarget(currentTargetTile[personaName])
				: toPixelTarget(currTile);
			window.__EDSIM_DEBUG__.movement[personaName] = {
				pathLength: movementPathQueue[personaName].length,
				queueLength: movementPathQueue[personaName].length,
				collisionHits: 0,
				source: pathResult.source,
				warning: pathResult.warning,
				targetTile: targetTile,
				currentTargetTile: currentTargetTile[personaName],
				settledTile: currTile,
			};
		}
		hasConsumedMovement = true;
		window.__EDSIM_DEBUG__.initialMovementConsumed = true;
		refreshRuntimeDebugState();
		execute_ready = true;
	}

	function updateMovementTargetForPersona(personaName) {
		if (!movementPathQueue[personaName] || !movementPathQueue[personaName].length) {
			currentTargetTile[personaName] = null;
			if (window.__EDSIM_DEBUG__.movement[personaName]) {
				window.__EDSIM_DEBUG__.movement[personaName].currentTargetTile = null;
				window.__EDSIM_DEBUG__.movement[personaName].queueLength = 0;
			}
			return;
		}
		currentTargetTile[personaName] = movementPathQueue[personaName][0];
		movement_target[personaName] = toPixelTarget(currentTargetTile[personaName]);
		if (window.__EDSIM_DEBUG__.movement[personaName]) {
			window.__EDSIM_DEBUG__.movement[personaName].currentTargetTile = currentTargetTile[personaName];
			window.__EDSIM_DEBUG__.movement[personaName].queueLength = movementPathQueue[personaName].length;
		}
	}

	function playIdleFrame(sprite, personaName) {
		sprite.anims.stop();
		const spriteKey = sprite.getData("spriteKey") || spriteKeyForPersona(personaName);
		sprite.setTexture(spriteKey);
		if (pre_anims_direction_dict[personaName] === "l") sprite.setFrame(3);
		else if (pre_anims_direction_dict[personaName] === "r") sprite.setFrame(6);
		else if (pre_anims_direction_dict[personaName] === "u") sprite.setFrame(9);
		else sprite.setFrame(0);
	}

	function advancePersonaPlayback(personaName) {
		const sprite = personas[personaName];
		if (!sprite || !currentTargetTile[personaName]) {
			if (sprite) playIdleFrame(sprite, personaName);
			return true;
		}
		const target = movement_target[personaName];
		let direction = "";
		if (sprite.body.x < target[0]) {
			sprite.body.x = stepTowards(sprite.body.x, target[0], movement_speed_pixels);
			direction = "r";
		} else if (sprite.body.x > target[0]) {
			sprite.body.x = stepTowards(sprite.body.x, target[0], movement_speed_pixels);
			direction = "l";
		} else if (sprite.body.y < target[1]) {
			sprite.body.y = stepTowards(sprite.body.y, target[1], movement_speed_pixels);
			direction = "d";
		} else if (sprite.body.y > target[1]) {
			sprite.body.y = stepTowards(sprite.body.y, target[1], movement_speed_pixels);
			direction = "u";
		}
		if (direction) {
			pre_anims_direction_dict[personaName] = direction;
			const spriteKey = sprite.getData("spriteKey") || spriteKeyForPersona(personaName);
			if (direction === "l") sprite.anims.play(`${spriteKey}-left-walk`, true);
			else if (direction === "r") sprite.anims.play(`${spriteKey}-right-walk`, true);
			else if (direction === "u") sprite.anims.play(`${spriteKey}-up-walk`, true);
			else sprite.anims.play(`${spriteKey}-down-walk`, true);
		} else {
			playIdleFrame(sprite, personaName);
		}
		updatePersonaDecorations(personaName);
		if (window.__EDSIM_DEBUG__.movement[personaName]) {
			window.__EDSIM_DEBUG__.movement[personaName].settledTile = getCurrentTileForSprite(sprite);
			window.__EDSIM_DEBUG__.movement[personaName].queueLength = movementPathQueue[personaName].length;
			window.__EDSIM_DEBUG__.movement[personaName].currentTargetTile = currentTargetTile[personaName];
		}
		if (sprite.body.x === target[0] && sprite.body.y === target[1]) {
			movementPathQueue[personaName].shift();
			updateMovementTargetForPersona(personaName);
		}
		return currentTargetTile[personaName] === null;
	}

	function finalizeMovementPlayback() {
		for (let i = 0; i < Object.keys(personas).length; i++) {
			const personaName = Object.keys(personas)[i];
			const sprite = personas[personaName];
			if (!sprite || !pendingSnapTile[personaName]) continue;
			const target = toPixelTarget(pendingSnapTile[personaName]);
			sprite.body.x = target[0];
			sprite.body.y = target[1];
			updatePersonaDecorations(personaName);
			playIdleFrame(sprite, personaName);
			if (window.__EDSIM_DEBUG__.movement[personaName]) {
				window.__EDSIM_DEBUG__.movement[personaName].settledTile = pendingSnapTile[personaName];
				window.__EDSIM_DEBUG__.movement[personaName].currentTargetTile = null;
				window.__EDSIM_DEBUG__.movement[personaName].queueLength = 0;
			}
		}
		execute_ready = false;
	}

	function create() {
		const map = this.make.tilemap({ key: "map" });
		const blocks_2 = map.addTilesetImage("blocks_2", "blocks_2");
		const blocks_3 = map.addTilesetImage("blocks_3", "blocks_3");
		const atlas_32x = map.addTilesetImage("atlas_32x", "atlas_32x");
		const shop_and_hospital = map.addTilesetImage("shop-and-hospital", "shop-and-hospital");
		const tileset_B = map.addTilesetImage("tileset_B", "tileset_B");
		map.createLayer("Object Interaction Layer", [blocks_2, blocks_3, atlas_32x, shop_and_hospital, tileset_B], 0, 0);
		map.createLayer("Sector Layer", [blocks_2, blocks_3, atlas_32x, shop_and_hospital, tileset_B], 0, 0);
		map.createLayer("Arena Layer", [blocks_2, blocks_3, atlas_32x, shop_and_hospital, tileset_B], 0, 0);
		map.createLayer("Spawning Blocks", [blocks_2, blocks_3, atlas_32x, shop_and_hospital, tileset_B], 0, 0);
		const collisionsLayer = map.createLayer("Collisions", [blocks_2, blocks_3, atlas_32x, shop_and_hospital, tileset_B], 0, 0);
		map.createLayer("Floor", [blocks_2, blocks_3, atlas_32x, shop_and_hospital, tileset_B], 0, 0);
		map.createLayer("Walls", [blocks_2, blocks_3, atlas_32x, shop_and_hospital, tileset_B], 0, 0);

	}

	function update(time, delta) {
		let play_context = this;
		function game_resume() { play_context.scene.resume(); }
		function game_pause() { play_context.scene.pause(); }
		play_button.onclick = function(){ game_resume(); };
		pause_button.onclick = function(){ game_pause(); };

		if (bootstrap_environment_pending) {
			bootstrap_environment_pending = false;
			movement_wait_reason = "bootstrap_environment_writeback";
			postEnvironmentSnapshot(playback_step, "update");
			updateRuntimeStatusBanner(`Published bootstrap environment/${playback_step}.json so backend can advance to the next movement step.`);
			return;
		}

		if (phase === "process") {
			postEnvironmentSnapshot(step, "update");
			return;
		}

		if (phase === "update") {
			if (timer <= 0) {
				pollRuntimeStatus(function() {
					const latestMovementStep = runtime_sync.latest_movement_step;
					const movementReady = latestMovementStep !== null && latestMovementStep !== undefined && latestMovementStep >= playback_step;
					if (!movementReady) {
						timer = timer_max;
						alignPlaybackWithRuntime();
						refreshRuntimeDebugState();
						updateRuntimeStatusBanner();
						return;
					}
					if (movement_request) {
						return;
					}
					movement_request = new XMLHttpRequest();
					movement_request.overrideMimeType("application/json");
					movement_request.open("POST", "{% url 'update_environment' %}", true);
					movement_request.addEventListener("load", function() {
						try {
							if (this.readyState === 4 && movement_request.status === 200) {
								const payload = JSON.parse(movement_request.responseText);
								if (payload["<step>"] == playback_step) {
									execute_movement = payload;
									execute_ready = false;
									movement_wait_reason = "movement_loaded";
									phase = "execute";
									timer = 0;
									updateRuntimeStatusBanner(`Consuming movement step ${playback_step}.`);
								} else {
									timer = timer_max;
									movement_wait_reason = "movement_step_missing";
									updateRuntimeStatusBanner(`Backend progress reached movement ${formatRuntimeValue(latestMovementStep)}, but movement/${playback_step}.json is not available yet.`);
								}
							}
						} finally {
							movement_request = null;
						}
					});
					movement_request.addEventListener("error", function() {
						movement_request = null;
						timer = timer_max;
						movement_wait_reason = "movement_request_failed";
						updateRuntimeStatusBanner("Movement fetch failed; retrying.");
					});
					movement_request.send(JSON.stringify({"step": playback_step, "sim_code": sim_code }));
				});
			}
			timer = timer - 1;
			return;
		}

		document.getElementById("game-time-content").innerHTML = execute_movement["meta"]["curr_time"];
		const diff = symmetricDifference(Object.keys(execute_movement["persona"]), Object.keys(personas));
		for (let j = 0; j < diff.length; j++) {
			const personaName = diff[j];
			if (!Object.keys(personas).includes(personaName)) {
				createPersonaVisual(this, personaName, execute_movement["persona"][personaName]["movement"], execute_movement["persona"][personaName]);
			} else if (!Object.keys(execute_movement["persona"]).includes(personaName)) {
				removePersonaVisual(personaName);
			}
		}

		const firstExecuteFrame = !execute_ready;
		if (!execute_ready) {
			prepareMovementPlayback();
		}
		if (firstExecuteFrame) {
			updatePronunciatios();
			updatePersonaPanels();
			const movementEntries = Object.values(window.__EDSIM_DEBUG__.movement || {});
			const hasQueuedMotion = movementEntries.some((data) => Array.isArray(data.settledTile) && (data.queueLength > 0 || data.source === "adjacent_fallback" || data.source === "movement_path"));
			if (!hasQueuedMotion && movementEntries.length) {
				movement_wait_reason = "frontend_consumption_failure";
				refreshRuntimeDebugState();
			}
		}

		let everyoneSettled = true;
		for (let i = 0; i < Object.keys(personas).length; i++) {
			let personaName = Object.keys(personas)[i];
			if (!execute_movement["persona"][personaName]) continue;
			if (!advancePersonaPlayback(personaName)) {
				everyoneSettled = false;
			}
		}
		if (everyoneSettled) {
			finalizeMovementPlayback();
			phase = "process";
			render_step = playback_step;
			playback_step = playback_step + 1;
			step = playback_step;
			movement_wait_reason = "movement_consumed";
			refreshRuntimeDebugState();
			updateRuntimeStatusBanner();
		}
	}
